<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人卡路里與減重進度管理</title>
    <style>
        :root {
            --primary: #ff6b81;
            --primary-hover: #ff4757;
            --secondary: #2ed573;
            --danger: #ff4d4d;
            --bg: #f7f9fc;
            --card-bg: #ffffff;
            --text: #2f3542;
            --text-light: #747d8c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: var(--text);
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* ========== 頂部核心控制按鈕組 (對齊截圖風格) ========== */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }

        .btn-ctrl {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        .btn-ctrl:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .btn-import { background-color: #28a745; } /* 綠色 */
        .btn-import:hover { background-color: #218838; }

        .btn-export { background-color: #17a2b8; } /* 藍綠色 */
        .btn-export:hover { background-color: #138496; }

        .btn-reset { background-color: #dc3545; } /* 紅色 */
        .btn-reset:hover { background-color: #c82333; }

        .btn-upload { background-color: #6f42c1; } /* 紫色 */
        .btn-upload:hover { background-color: #5a32a3; }

        .btn-download { background-color: #fd7e14; } /* 橘色 */
        .btn-download:hover { background-color: #e96b02; }

        .btn-settings { background-color: #6c757d; } /* 灰色 */
        .btn-settings:hover { background-color: #5a6268; }

        .file-input { display: none; }

        /* ========== 儀表板 ========== */
        .dashboard {
            background: linear-gradient(135deg, #fff1f2, #ffe4e6);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #ffe4e6;
        }

        .tdee-setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #fecdd3;
        }

        .tdee-setting input {
            width: 80px;
            padding: 4px 8px;
            border: 1px solid #fda4af;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .stat-box {
            background: rgba(255,255,255,0.7);
            padding: 12px;
            border-radius: 8px;
        }

        .stat-box.highlight {
            grid-column: span 2;
            background: var(--primary);
            color: white;
        }

        .stat-val {
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
        }

        .stat-box.highlight .stat-val {
            font-size: 26px;
        }

        /* ========== 表單控制 ========== */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 129, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: var(--primary-hover); }

        /* ========== 歷史紀錄列表 ========== */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .log-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primary);
        }

        .log-item.type-exercise {
            border-left-color: var(--secondary);
        }

        .log-info h4 { margin: 0 0 4px 0; font-size: 14px; }
        .log-info span { font-size: 12px; color: var(--text-light); }

        .log-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .log-cal { font-weight: bold; font-size: 15px; }
        .type-food .log-cal { color: #eb4d4b; }
        .type-exercise .log-cal { color: #2ed573; }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        /* ========== GitHub 同步設定彈窗 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .modal-body .hint {
            font-size: 12px;
            color: #666;
            margin-top: -12px;
            margin-bottom: 15px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .sync-status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }
        .sync-status.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .sync-status.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="modal-overlay" id="githubModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚙️ GitHub 同步設定</h3>
            <button class="modal-close" onclick="closeGithubModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="syncStatus" class="sync-status"></div>
            
            <label style="margin-top:10px;">GitHub Personal Access Token</label>
            <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" style="margin-bottom:15px;">
            <p class="hint">需要擁有 repo 權限的 Access Token</p>
            
            <label>Repository (儲存庫)</label>
            <input type="text" id="githubRepo" placeholder="使用者名稱/儲存庫名稱" style="margin-bottom:15px;">
            <p class="hint">格式範例：mygithubusername/my-calorie-repo</p>
            
            <label>儲存檔案路徑</label>
            <input type="text" id="githubPath" value="data/calorie-data.json" style="margin-bottom:15px;">
            <p class="hint">資料備份在 GitHub 中的 JSON 路徑</p>
        </div>
        <div class="modal-footer">
            <button class="btn-ctrl btn-settings" onclick="closeGithubModal()">取消</button>
            <button class="btn-ctrl btn-import" onclick="saveGithubSettings()">儲存設定</button>
        </div>
    </div>
</div>

<div class="container">
    <h1>卡路里與減重助手</h1>
    <div class="subtitle">專為 44 歲女性量身設計（久坐不動標準）</div>

    <div class="controls">
        <button class="btn-ctrl btn-import" onclick="triggerLocalImport()">📥 導入資料</button>
        <button class="btn-ctrl btn-export" onclick="exportLocalData()">📤 導出資料</button>
        <button class="btn-ctrl btn-reset" onclick="resetLocalData()">🔄 重置</button>
        <button class="btn-ctrl btn-upload" onclick="uploadToGithub()">☁️ 上傳雲端</button>
        <button class="btn-ctrl btn-download" onclick="downloadFromGithub()">📥 下載雲端</button>
        <button class="btn-ctrl btn-settings" onclick="openGithubModal()">⚙️ 同步設定</button>
        
        <input type="file" id="fileInput" class="file-input" accept=".json" onchange="handleFileImport(event)">
    </div>

    <div class="dashboard">
        <div class="tdee-setting">
            <span>每日基礎所需 (TDEE)：</span>
            <div>
                <input type="number" id="tdeeInput" value="1750" onchange="updateTDEE(this.value)"> kcal
            </div>
        </div>
        <div class="stat-grid">
            <div class="stat-box">
                <div>今日已攝取</div>
                <div class="stat-val" id="todayEat" style="color: #eb4d4b;">0 kcal</div>
            </div>
            <div class="stat-box">
                <div>今日已消耗 (含基礎)</div>
                <div class="stat-val" id="todayBurn" style="color: #2ed573;">1750 kcal</div>
            </div>
            <div class="stat-box highlight">
                <div>距離減去 1kg 目標還差</div>
                <div class="stat-val" id="targetLeft">7,700 kcal</div>
                <div style="font-size: 11px; margin-top: 5px; opacity: 0.9;">(累積創造 7,700 kcal 赤字即可減重 1kg)</div>
            </div>
        </div>
    </div>

    <h3 id="formTitle" style="margin-bottom:15px;">新增紀錄</h3>
    <input type="hidden" id="editIndex" value="-1">
    
    <div class="form-group">
        <label>項目類別</label>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="itemType" value="food" checked onclick="toggleType()"> 飲食攝取 (+)
            </label>
            <label class="radio-label">
                <input type="radio" name="itemType" value="exercise" onclick="toggleType()"> 額外運動 (-)
            </label>
        </div>
    </div>

    <div class="form-group">
        <label id="nameLabel">食物名稱 / 項目</label>
        <input type="text" id="itemName" placeholder="例如：白飯、煎豬扒">
    </div>

    <div class="form-group">
        <label>卡路里 (kcal)</label>
        <input type="number" id="itemCal" placeholder="例如：260">
    </div>

    <button class="btn-submit" id="submitBtn" onclick="saveItem()">加入紀錄</button>
    <button class="btn-ctrl btn-settings" id="cancelBtn" style="width:100%; margin-top:5px; display:none; justify-content:center;" onclick="resetForm()">取消修改</button>

    <div class="history-header">
        <h3>歷史紀錄明細</h3>
        <span style="font-size: 12px; color: var(--text-light);" id="logCount">共 0 項</span>
    </div>

    <div class="log-list" id="logList"></div>
</div>

<script>
    // 狀態宣告
    let appData = {
        tdee: 1750,
        logs: []
    };

    window.onload = function() {
        const local = localStorage.getItem('calorie_tracker_data');
        if (local) {
            appData = JSON.parse(local);
            if(!appData.tdee) appData.tdee = 1750;
        }
        document.getElementById('tdeeInput').value = appData.tdee;
        render();
    };

    function saveData() {
        localStorage.setItem('calorie_tracker_data', JSON.stringify(appData));
    }

    function updateTDEE(val) {
        appData.tdee = parseInt(val) || 1750;
        saveData();
        render();
    }

    function toggleType() {
        const type = document.querySelector('input[name="itemType"]:checked').value;
        const nameLabel = document.getElementById('nameLabel');
        const itemName = document.getElementById('itemName');
        
        if (type === 'food') {
            nameLabel.innerText = '食物名稱 / 項目';
            itemName.placeholder = '例如：白飯、煎豬扒';
        } else {
            nameLabel.innerText = '運動 / 消耗項目';
            itemName.placeholder = '例如：急步走、做家務';
        }
    }

    function saveItem() {
        const name = document.getElementById('itemName').value.trim();
        const cal = parseInt(document.getElementById('itemCal').value);
        const type = document.querySelector('input[name="itemType"]:checked').value;
        const editIndex = parseInt(document.getElementById('editIndex').value);

        if (!name || !cal) {
            alert('請完整輸入名稱與卡路里！');
            return;
        }

        if (editIndex === -1) {
            appData.logs.unshift({
                id: Date.now(),
                type: type,
                name: name,
                cal: cal,
                date: new Date().toLocaleDateString()
            });
        } else {
            appData.logs[editIndex].name = name;
            appData.logs[editIndex].cal = cal;
            appData.logs[editIndex].type = type;
        }

        saveData();
        resetForm();
        render();
    }

    function deleteItem(index) {
        if (confirm('確定要刪除這筆紀錄嗎？')) {
            appData.logs.splice(index, 1);
            saveData();
            render();
        }
    }

    function editItem(index) {
        const item = appData.logs[index];
        document.getElementById('formTitle').innerText = '修改紀錄';
        document.getElementById('editIndex').value = index;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemCal').value = item.cal;
        
        const radios = document.getElementsByName('itemType');
        for (let r of radios) {
            if (r.value === item.type) r.checked = true;
        }
        
        toggleType();
        document.getElementById('submitBtn').innerText = '儲存修改';
        document.getElementById('cancelBtn').style.display = 'flex';
    }

    function resetForm() {
        document.getElementById('formTitle').innerText = '新增紀錄';
        document.getElementById('editIndex').value = "-1";
        document.getElementById('itemName').value = "";
        document.getElementById('itemCal').value = "";
        document.getElementById('submitBtn').innerText = '加入紀錄';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function render() {
        const logList = document.getElementById('logList');
        logList.innerHTML = '';

        let todayEat = 0;
        let todayExtraBurn = 0;

        appData.logs.forEach((item, index) => {
            if (item.type === 'food') todayEat += item.cal;
            else todayExtraBurn += item.cal;

            const itemEl = document.createElement('div');
            itemEl.className = `log-item type-${item.type}`;
            itemEl.innerHTML = `
                <div class="log-info">
                    <h4>${escapeHtml(item.name)}</h4>
                    <span>${item.date} · ${item.type === 'food' ? '飲食' : '運動'}</span>
                </div>
                <div class="log-actions">
                    <span class="log-cal">${item.type === 'food' ? '+' : '-'}${item.cal} kcal</span>
                    <button class="action-btn" onclick="editItem(${index})">✏️</button>
                    <button class="action-btn" onclick="deleteItem(${index})">❌</button>
                </div>
            `;
            logList.appendChild(itemEl);
        });

        document.getElementById('todayEat').innerText = `${todayEat} kcal`;
        document.getElementById('todayBurn').innerText = `${appData.tdee + todayExtraBurn} kcal`;

        // 計算累積赤字進度
        let totalDeficit = 0;
        const dateGroups = {};
        appData.logs.forEach(item => {
            if (!dateGroups[item.date]) dateGroups[item.date] = { eat: 0, burn: 0 };
            if (item.type === 'food') dateGroups[item.date].eat += item.cal;
            else dateGroups[item.date].burn += item.cal;
        });

        Object.keys(dateGroups).forEach(date => {
            const dayDeficit = (appData.tdee + dateGroups[date].burn) - dateGroups[date].eat;
            if (dayDeficit > 0) totalDeficit += dayDeficit;
        });

        const targetLeft = Math.max(0, 7700 - totalDeficit);
        document.getElementById('targetLeft').innerText = targetLeft <= 0 ? "恭喜！已達成減重 1kg 目標！🎉" : `${targetLeft.toLocaleString()} kcal`;
        document.getElementById('logCount').innerText = `共 ${appData.logs.length} 項紀錄`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    /* ==================== 導入 / 導出 / 重置邏輯 ==================== */
    function exportLocalData() {
        const data = { appData: appData, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `卡路里紀錄備份_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function triggerLocalImport() { document.getElementById('fileInput').click(); }

    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (confirm('導入此備份檔案將會覆蓋本地的所有數據，確定嗎？')) {
                    appData = data.appData || { tdee: 1750, logs: [] };
                    saveData();
                    render();
                    document.getElementById('tdeeInput').value = appData.tdee;
                    alert('資料導入成功！');
                }
            } catch (error) {
                alert('檔案格式解析失敗，請選擇正確的 JSON 備份檔！');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function resetLocalData() {
        if (confirm('確定要清除所有卡路里紀錄嗎？此操作無法恢復！')) {
            appData = { tdee: 1750, logs: [] };
            saveData();
            render();
            document.getElementById('tdeeInput').value = 1750;
            alert('本地數據已成功清空！');
        }
    }

    /* ==================== GitHub 同步核心代碼移植 ==================== */
    function openGithubModal() {
        document.getElementById('githubModal').classList.add('active');
        const settings = getGithubSettings();
        document.getElementById('githubToken').value = settings.token || '';
        document.getElementById('githubRepo').value = settings.repo || '';
        document.getElementById('githubPath').value = settings.path || 'data/calorie-data.json';
        updateSyncStatus('', '');
    }

    function closeGithubModal() { document.getElementById('githubModal').classList.remove('active'); }
    function getGithubSettings() { return JSON.parse(localStorage.getItem('calorieGithubSettings')) || {}; }

    function saveGithubSettings() {
        const token = document.getElementById('githubToken').value.trim();
        const repo = document.getElementById('githubRepo').value.trim();
        const path = document.getElementById('githubPath').value.trim();

        if (!token || !repo || !path) {
            updateSyncStatus('請填寫完整設定欄位！', 'error');
            return;
        }
        localStorage.setItem('calorieGithubSettings', JSON.stringify({ token, repo, path }));
        updateSyncStatus('GitHub 設定儲存成功！', 'success');
        setTimeout(closeGithubModal, 1000);
    }

    function updateSyncStatus(message, type) {
        const statusEl = document.getElementById('syncStatus');
        statusEl.textContent = message;
        statusEl.className = 'sync-status';
        if (type) statusEl.classList.add(type);
    }

    async function uploadToGithub() {
        const settings = getGithubSettings();
        if (!settings.token || !settings.repo || !settings.path) {
            alert('請先點選右側「⚙️ 同步設定」完成 GitHub 的 Token 與儲存庫綁定！');
            openGithubModal();
            return;
        }

        try {
            const data = { appData: appData, lastUpdated: new Date().toISOString() };
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
            let sha = null;

            try {
                const getResponse = await fetch(`https://api.github.com/repos/${settings.repo}/contents/${settings.path}`, {
                    headers: { 'Authorization': `token ${settings.token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (getResponse.ok) { const fileData = await getResponse.json(); sha = fileData.sha; }
            } catch (e) {}

            const body = { message: `Update Calorie Data - ${new Date().toLocaleString('zh-HK')}`, content: content };
            if (sha) body.sha = sha;

            const response = await fetch(`https://api.github.com/repos/${settings.repo}/contents/${settings.path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${settings.token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (response.ok) alert('✅ 卡路里數據已成功備份上傳至 GitHub 雲端！');
            else { const err = await response.json(); throw new Error(err.message || '上傳失敗'); }
        } catch (error) { alert('❌ 上傳雲端失敗：' + error.message); }
    }

    async function downloadFromGithub() {
        const settings = getGithubSettings();
        if (!settings.token || !settings.repo || !settings.path) {
            alert('請先點選右側「⚙️ 同步設定」設定 GitHub 帳戶資料！');
            openGithubModal();
            return;
        }

        try {
            const response = await fetch(`https://api.github.com/repos/${settings.repo}/contents/${settings.path}`, {
                headers: { 'Authorization': `token ${settings.token}`, 'Accept': 'application/vnd.github.v3+json' }
            });

            if (!response.ok) {
                if (response.status === 404) throw new Error('雲端無此路徑檔案，請先執行上傳備份！');
                throw new Error('下載錯誤');
            }

            const fileData = await response.json();
            const content = decodeURIComponent(escape(atob(fileData.content)));
            const data = JSON.parse(content);

            if (confirm('確定要從 GitHub 雲端拉取歷史進度並「覆蓋本地所有紀錄」嗎？')) {
                appData = data.appData || { tdee: 1750, logs: [] };
                saveData();
                render();
                document.getElementById('tdeeInput').value = appData.tdee;
                alert('✅ 已完美同步還原 GitHub 雲端進度！');
            }
        } catch (error) { alert('❌ 下載雲端失敗：' + error.message); }
    }

    document.getElementById('githubModal').addEventListener('click', function(e) { if (e.target === this) closeGithubModal(); });
</script>

</body>
</html>
